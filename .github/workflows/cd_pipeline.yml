name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
    deploy:
    runs-on: ubuntu-latest
    name: "Deploy to Kyma"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # --- Build and Push Docker Image ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: cc-ms-k8s-training.common.repositories.cloud.sap
          username: ${{ secrets.REGISTRY_USERNAME }} 
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: cc-ms-k8s-training.common.repositories.cloud.sap/devops-assignment-i528926:${{github.sha}}

      # --- Deploy to Kyma using kubectl ---
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
        
      - name: update kubernetes deployment with new image
        run: |
          cd k8s
          sed -i 's|cc-ms-k8s-training.common.repositories.cloud.sap/devops-assignment-i528926:.*|cc-ms-k8s-training.common.repositories.cloud.sap/devops-assignment-i528926:${{ github.sha }}|g' app.yaml
          cat app.yaml
            
      - name: Deploy to Kyma Cluster
        run: |
            echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml
            export KUBECONFIG=$(pwd)/kubeconfig.yaml
            kubectl apply -f k8s

    changelog_generation:
        needs: deploy
        runs-on: ubuntu-latest
        name: "Generate Changelog"
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3
              with:
              fetch-depth: 0
              token: ${{ secrets.MY_PAT }}

            - name: set up git credentials
              run: |
                git config --global user.email "kaifmohd2014@gmail.com"
                git config --global user.name "kaifcoder"

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
              python-version: '3.x'

            - name: Install Python Dependencies
              run: |
                python -m pip install --upgrade pip
                pip install requests

            - name: Run Changelog Generation Script
              env:
              GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
              run: python .github/scripts/generate_changelog.py

            - name: Push Changelog Updates
              env:
              GITHUB_TOKEN: ${{ secrets.MY_PAT }}
              run: |
                git pull origin main
                git add CHANGELOG.md
                git commit -m "Update Changelog [ci skip]"
                git push --force
