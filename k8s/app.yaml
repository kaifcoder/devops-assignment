# NOTE: The regcred secret should be created separately using kubectl
# Do NOT commit actual credentials to version control
# Create the secret using:
# kubectl create secret docker-registry regcred \
#   --docker-server=cc-ms-k8s-training.common.repositories.cloud.sap \
#   --docker-username=<your-username> \
#   --docker-password=<your-password>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-assignment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-assignment
  template:
    metadata:
      labels:
        app: devops-assignment
    spec:
      containers:
      - name: devops-assignment
        image: cc-ms-k8s-training.common.repositories.cloud.sap/devops-assignment-i528926:latest
        imagePullPolicy: Always
        ports:
            - containerPort: 8000
      imagePullSecrets:
        - name: regcred

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-assignment
spec:
  ingressClassName: istio
  rules:
    - host: devops-assignment.c-3b70c67.kyma.ondemand.com
      http:
        paths:
        - backend:
            service:
              name: devops-assignment
              port:
                number: 8000
          path: /
          pathType: Prefix
  tls:
    - hosts:
      - devops-assignment.c-3b70c67.kyma.ondemand.com
      secretName: kyma-gateway-certs
  